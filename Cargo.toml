[package]
name = "doors"
version = "0.3.0"
edition = "2021"
description = "Minimal GTK4/Libadwaita Windows (.exe) game installer and runner using compatibilitytools.d"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ico = "0.6"
png = "0.18"
walkdir = "2.5"
dirs = "7.0"
libc = "0.2"
anyhow = "1.0"
gettext = "0.4"
sys-locale = "0.3"
once_cell = "1.21"

